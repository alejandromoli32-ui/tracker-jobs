[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "job-hunter"
version = "0.1.0"
description = "Multi-Profile Job Tracker & Hunter Engine (Colombia & Remote)"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "openpyxl>=3.1",
    "beautifulsoup4>=4.12",
    "requests>=2.31",
    "lxml>=5.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-mock>=3.12",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-mock>=3.12",
]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-v --strict-markers"
