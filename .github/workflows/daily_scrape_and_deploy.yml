name: Daily Job Hunter & Netlify Deploy

on:
  schedule:
    # Corre todos los días a las 11:00 UTC (06:00 AM hora Colombia)
    - cron: '0 11 * * *'
  workflow_dispatch: # Permite ejecutar manualmente desde la pestaña Actions de GitHub

permissions:
  contents: write

jobs:
  scrape-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install uv
        run: curl -LsSf https://astral.sh/uv/install.sh | sh

      - name: Install dependencies
        run: |
          uv sync --frozen || uv pip install -e .

      - name: Run daily scraper and update dashboard
        run: |
          uv run python daily_updater.py --pages 2

      - name: Commit updated job tracker files
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add output/ index.html dashboard.html dashboard_tecnico_sistemas.html
          if git diff --staged --quiet; then
            echo "No hay cambios nuevos en las vacantes."
          else
            git commit -m "chore(tracker): actualizacion diaria de vacantes $(date +'%Y-%m-%d')"
            git push
          fi

      - name: Deploy to Netlify
        if: env.NETLIFY_AUTH_TOKEN != '' && env.NETLIFY_SITE_ID != ''
        uses: nwtgck/actions-netlify@v3.0
        with:
          publish-dir: '.'
          production-deploy: true
          github-token: ${{ secrets.GITHUB_TOKEN }}
          deploy-message: "Deploy diario automatizado $(date +'%Y-%m-%d')"
          enable-pull-request-comment: false
          enable-commit-comment: true
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
